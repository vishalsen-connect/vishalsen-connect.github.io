<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --fg: #ffffff;
      }
    }

    rect {
      fill: var(--bg);
      rx: 18;
    }

    text {
      fill: var(--fg);
      font-size: 46px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <rect width="100" height="100"/>
  <text x="50" y="52">VS</text>
</svg>
